# ===========================
# Chatrah Backend Configuration
# ===========================
# All secrets are loaded from environment variables.
# See CREDENTIALS_GUIDE.md for setup instructions.

# === DATABASE ===
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:postgres}
quarkus.datasource.password=${DB_PASSWORD:root}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/chatrah}
quarkus.datasource.jdbc.max-size=50
quarkus.datasource.jdbc.min-size=5
quarkus.hibernate-orm.database.generation=update

quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.sql-load-script=no-file

quarkus.http.port=8081
# Bind to all interfaces — backend is protected by gateway secret header
quarkus.http.host=0.0.0.0

# Gateway shared secret — backend rejects requests without this header
chatrah.gateway.secret=${GATEWAY_SECRET:dev-secret-local}

# === JWT ===
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:publicKey.pem}
mp.jwt.verify.issuer=chatrah-school
smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION:privateKey_pkcs8.pem}
smallrye.jwt.time-to-live=3600

# === HTTP SECURITY ===
quarkus.http.auth.permission.public.paths=/api/auth/login,/api/auth/otp/*,/api/auth/password/reset,/api/school/profile,/api/events/upcoming,/api/blogs/approved,/api/payments/webhook
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.authenticated.paths=/api/*
quarkus.http.auth.permission.authenticated.policy=authenticated

# === EMAIL / SMTP ===
quarkus.mailer.from=${SMTP_FROM:jinukalaraneesh31@gmail.com}
quarkus.mailer.host=${SMTP_HOST:smtp.gmail.com}
quarkus.mailer.port=${SMTP_PORT:587}
quarkus.mailer.username=${SMTP_USERNAME:jinukalaraneesh31@gmail.com}
quarkus.mailer.password=${SMTP_PASSWORD:}
quarkus.mailer.start-tls=REQUIRED
quarkus.mailer.ssl=false
quarkus.mailer.mock=${SMTP_MOCK:false}

# === RAZORPAY ===
razorpay.key_id=${RAZORPAY_KEY_ID:rzp_test_placeholder}
razorpay.key_secret=${RAZORPAY_KEY_SECRET:placeholder_secret}
razorpay.webhook_secret=${RAZORPAY_WEBHOOK_SECRET:placeholder_webhook_secret}

# === SMS (MSG91) ===
sms.provider=${SMS_PROVIDER:mock}
sms.msg91.auth_key=${MSG91_AUTH_KEY:placeholder_auth_key}
sms.msg91.sender_id=${MSG91_SENDER_ID:CHATRAH}
sms.msg91.template_id=${MSG91_TEMPLATE_ID:placeholder_template_id}
sms.enabled=${SMS_ENABLED:false}

# === ATTENDANCE ALERTS ===
attendance.alert.enabled=${ATTENDANCE_ALERT_ENABLED:false}
attendance.alert.cron=0 0 21 * * ?
attendance.threshold.percent=${ATTENDANCE_THRESHOLD:75}

# === OPENAPI / SWAGGER ===
quarkus.smallrye-openapi.path=/openapi
# Swagger UI only in dev mode (disabled in prod automatically when always-include=false)
quarkus.swagger-ui.always-include=false
quarkus.swagger-ui.path=/swagger-ui

quarkus.console.enabled=false
