# Test configuration - uses same PostgreSQL but separate schema
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=root
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/chatrah_test
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=false

# JWT test config
mp.jwt.verify.publickey.location=publicKey.pem
smallrye.jwt.sign.key.location=privateKey_pkcs8.pem
mp.jwt.verify.issuer=chatrah-school

# Disable mailer
quarkus.mailer.mock=true

# Gateway secret
chatrah.gateway.secret=test-secret

# HTTP
quarkus.http.port=8181
quarkus.http.host=127.0.0.1
